name: Update classical performances

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run KOPIS pipeline
        env:
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python fetch_kopis_classical.py

      - name: Run official venue schedule pipeline
        env:
          PYTHONUNBUFFERED: "1"
        continue-on-error: true
        run: python fetch_venue_schedules.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/performances.json
          if [ -f data/venue_schedules.json ]; then
            git add data/venue_schedules.json
          fi
          git diff --staged --quiet || git commit -m "chore: update performances data"
          git push
