name: Update classical performances

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch: {}     # 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run KOPIS pipeline
        env:
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
        run: python fetch_kopis_classical.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/performances.json
          git diff --staged --quiet || git commit -m "chore: update performances data"
          git push
